<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Critical Care Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;650;700&family=Fraunces:opsz,wght@9..144,520&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 50% 18%, #12304e, transparent 55%),
        #07111c;
      color: #e7f3ff;
      font-family: Figtree, ui-sans-serif, system-ui, sans-serif;
    }
    button, a { font: inherit; color: inherit; }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 14px 8px;
    }
    header svg { flex: none; }
    header p {
      margin: 0;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8ecfff;
      font-size: 11px;
    }
    header h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 520;
      font-size: 28px;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1.05fr) 146px minmax(0, 0.95fr);
      gap: 8px;
      padding: 0 8px 6px;
    }
    .panel {
      min-height: 0;
      overflow: hidden;
      border: 1px solid #1e4e78;
      border-radius: 16px;
      background: rgba(6, 18, 34, 0.86);
      box-shadow: 0 0 0 1px rgba(62, 203, 255, 0.08);
      padding: 12px;
      display: flex;
      flex-direction: column;
    }
    .kicker {
      margin: 0 0 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7fd4e6;
      font-size: 11px;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: #3ee07a;
      box-shadow: 0 0 8px #3ee07a;
    }
    .feed { overflow: auto; display: flex; flex-direction: column; gap: 8px; }
    .feed a {
      display: block;
      text-decoration: none;
      background: rgba(12, 28, 48, 0.9);
      border: 1px solid #1c4266;
      border-radius: 12px;
      padding: 8px 10px;
    }
    .feed b {
      display: block;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7ee7ff;
      font-size: 10px;
    }
    .feed strong { display: block; font-size: 14px; line-height: 1.3; }
    .feed span { display: block; margin-top: 3px; color: #93aec4; font-size: 12px; }
    .monitor {
      position: relative;
      border: 1px solid #164e3a;
      border-radius: 16px;
      background: #04110c;
      overflow: hidden;
    }
    .monitor canvas { width: 100%; height: 100%; display: block; }
    .readout {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      pointer-events: none;
      font-weight: 700;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }
    .hr { color: #8fd0a8; }
    .bp { color: #e7a3a3; }
    .sat { color: #7fd4e6; }
    .rr { color: #f0d98a; }
    h2 {
      margin: 0 0 8px;
      font-family: Fraunces, Georgia, serif;
      font-weight: 520;
      font-size: 22px;
      letter-spacing: -0.03em;
    }
    .cards { flex: 1; min-height: 0; display: flex; gap: 8px; }
    .card {
      flex: 1;
      text-align: left;
      border-radius: 14px;
      border: 1px solid #1c4266;
      background: linear-gradient(160deg, rgba(16, 40, 64, 0.95), rgba(7, 16, 28, 0.95));
      padding: 8px;
      cursor: pointer;
    }
    .card b { display: block; font-size: 22px; }
    .card strong { display: block; font-size: 13px; }
    .card span { display: block; margin-top: 4px; color: #b7c9d8; font-size: 11px; line-height: 1.3; }
    .rose { color: #e7a3a3; }
    .amber { color: #e2b48a; }
    .cyan { color: #7fd4e6; }
    nav {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    nav button {
      min-height: 64px;
      border: 1px solid #1e5688;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(18, 36, 58, 0.94), rgba(8, 18, 32, 0.94));
      text-align: left;
      padding: 6px;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.1;
      cursor: pointer;
    }
    nav button span {
      display: block;
      color: #8ec8e6;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    nav button[data-on="1"] { background: #f3efe6; color: #1c1914; border-color: #f3efe6; }
    nav button[data-on="1"] span { color: #5c5348; }
    .note {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 92px;
      margin: 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: #10161c;
      border: 1px solid #7fd4e6;
      color: #f3efe6;
      font-size: 14px;
      line-height: 1.35;
    }
    @media (min-width: 900px) {
      main {
        grid-template-columns: minmax(220px, 320px) minmax(0, 1fr) minmax(220px, 320px);
        grid-template-rows: minmax(0, 1fr) 168px;
        padding: 0 16px 10px;
      }
      .updates { grid-column: 1; grid-row: 1 / span 2; }
      .monitor { grid-column: 2; grid-row: 2; }
      .board { grid-column: 3; grid-row: 1 / span 2; }
      .cards { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 64 64" width="42" height="42" aria-hidden="true">
      <path d="M32 6a26 26 0 1 0 0 52" fill="none" stroke="#2f8cff" stroke-width="6" />
      <path d="M8 34h10l4-10 6 20 5-12h23" fill="none" stroke="#7ee7ff" stroke-width="3" />
    </svg>
    <div>
      <p>Critical Care</p>
      <h1>Universe</h1>
    </div>
  </header>
  <main id="home">
    <section class="panel updates">
      <p class="kicker"><i class="dot"></i>Latest updates</p>
      <div class="feed" id="feed"></div>
    </section>
    <section class="monitor" aria-label="Live bay monitor">
      <div class="readout">
        <b class="hr" id="hr">76</b>
        <b class="bp" id="bp">118/74</b>
        <b class="sat">98</b>
        <b class="rr" id="rr">16</b>
      </div>
      <canvas id="trace"></canvas>
    </section>
    <section class="panel board">
      <p class="kicker">On the board</p>
      <h2>Take the shift</h2>
      <div class="cards">
        <button class="card" type="button" data-go="unit"><b class="rose">91</b><strong>Severe ARDS</strong><span>Saturation 84. The plateau is climbing.</span></button>
        <button class="card" type="button" data-go="unit"><b class="amber">88</b><strong>Septic shock</strong><span>Fever, a falling pressure, no drug in yet.</span></button>
        <button class="card" type="button" data-go="unit"><b class="cyan">86</b><strong>Ketoacidosis</strong><span>Missed insulin. The breathing is deep.</span></button>
      </div>
    </section>
  </main>
  <p class="note" id="note" hidden></p>
  <nav>
    <button type="button" id="hub"><span>Critical Care</span>Hub</button>
    <button type="button" data-go="unit"><span>Critical Care</span>Command Centre</button>
    <button type="button" data-go="team"><span>Multi</span>Disciplinary Team</button>
    <button type="button" data-go="custom"><span>Unit</span>Customize</button>
  </nav>
  <script>
    const HUB = "https://apoorvabeats-cyber.github.io/ARDS-INTERACTIVE-SIMULATOR/";
    const items = [
      { fresh: true, when: "2026 Nov 6", title: "Efficacy and Safety of Ulinastatin in the Treatment of Patients with Sepsis: The ADJUST Trial.", detail: "Chest", href: "https://pubmed.ncbi.nlm.nih.gov/42994751/" },
      { fresh: true, when: "2026 Nov 9", title: "Effect of Infection-Site-Targeted Postural Drainage on Mechanical Ventilation Duration in Intensive Care Unit Patients: A Randomized Controlled Trial.", detail: "J Nurs Res", href: "https://pubmed.ncbi.nlm.nih.gov/42993667/" },
      { fresh: true, when: "2026 Nov 5", title: "Extubation Failure in Pediatric Critical Care: A Secondary Analysis of the 2018-2019 Sedation and Weaning in Children (SandWiCh) Trial.", detail: "Pediatr Crit Care Med", href: "https://pubmed.ncbi.nlm.nih.gov/42987232/" },
      { fresh: true, when: "2026 Nov", title: "Mechanical ventilation vs bag-valve ventilation during cardiopulmonary resuscitation: a randomized crossover noninferiority trial.", detail: "Resusc Plus", href: "https://pubmed.ncbi.nlm.nih.gov/42985663/" },
      { fresh: false, when: "Guideline", title: "Surviving Sepsis Campaign", detail: "International guidance for sepsis and septic shock", href: "https://www.sccm.org/SurvivingSepsisCampaign/Guidelines" },
      { fresh: false, when: "Guideline", title: "KDIGO acute kidney injury", detail: "Prevention, staging, and renal replacement", href: "https://kdigo.org/guidelines/acute-kidney-injury/" },
      { fresh: false, when: "Landmark", title: "ARDS lung-protective ventilation", detail: "Low tidal volume and pressure limitation", href: "https://pubmed.ncbi.nlm.nih.gov/10793162/" }
    ];
    const feed = document.getElementById("feed");
    for (const item of items) {
      const a = document.createElement("a");
      a.href = item.href;
      a.target = "_blank";
      a.rel = "noreferrer";
      a.innerHTML = "<b>" + (item.fresh ? "New" : item.when) + "</b><strong></strong><span></span>";
      a.querySelector("strong").textContent = item.title;
      a.querySelector("span").textContent = item.detail;
      feed.appendChild(a);
    }
    const canvas = document.getElementById("trace");
    const ctx = canvas.getContext("2d");
    function frame(now) {
      const ratio = Math.min(2, window.devicePixelRatio || 1);
      const w = Math.max(8, Math.floor(canvas.clientWidth * ratio));
      const h = Math.max(8, Math.floor(canvas.clientHeight * ratio));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#04110c";
      ctx.fillRect(0, 0, w, h);
      document.getElementById("hr").textContent = String(Math.round(76 + Math.sin(now / 900) * 4));
      document.getElementById("bp").textContent = Math.round(118 + Math.sin(now / 1300) * 3) + "/" + Math.round(74 + Math.sin(now / 1500) * 2);
      document.getElementById("rr").textContent = String(Math.round(16 + Math.sin(now / 1700)));
      const top = h * 0.42;
      const sweep = (now / 2400) % 1;
      function lane(color, mid, amp) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2.2, ratio * 1.4);
        let drawing = false;
        for (let x = 0; x < w; x++) {
          const u = x / w;
          const gap = u > sweep && u < sweep + 0.05;
          const phase = (u * 2.1 + now / 800) % 1;
          let y = top + (h - top) * mid;
          if (phase > 0.1 && phase < 0.16) y -= Math.sin(((phase - 0.1) / 0.06) * Math.PI) * (h - top) * amp * 0.35;
          if (phase > 0.18 && phase < 0.26) y -= Math.sin(((phase - 0.18) / 0.08) * Math.PI) * (h - top) * amp;
          if (phase > 0.28 && phase < 0.4) y += Math.sin(((phase - 0.28) / 0.12) * Math.PI) * (h - top) * amp * 0.28;
          if (gap) { drawing = false; continue; }
          if (!drawing) { ctx.moveTo(x, y); drawing = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      lane("#3ee07a", 0.42, 0.55);
      lane("#7fd4e6", 0.78, 0.22);
      ctx.fillStyle = "#f3ffe8";
      ctx.fillRect(sweep * w, top, Math.max(3, ratio * 2), h - top - 6);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    const note = document.getElementById("note");
    function say(text) {
      note.hidden = false;
      note.textContent = text;
      clearTimeout(say.t);
      say.t = setTimeout(() => { note.hidden = true; }, 4200);
    }
    document.getElementById("hub").onclick = () => { window.location.assign(HUB); };
    document.body.addEventListener("click", (event) => {
      const go = event.target.closest("[data-go]");
      if (!go) return;
      if (go.dataset.go === "unit") say("The six-bed unit opens inside the Critical Care Universe app. This page is the front door. Hub opens the full ICU simulator.");
      else say("This bay is not open yet.");
    });
  </script>
</body>
</html>
